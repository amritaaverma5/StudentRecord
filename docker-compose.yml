services:
  mongodb:
    image: mongo:6.0
    container_name: lab27-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: myAppDB
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: lab27-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/myAppDB
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: lab27-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - backend

volumes:
  mongodb_data:
